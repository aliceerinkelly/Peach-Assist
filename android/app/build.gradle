plugins {
    id 'com.android.application'
}

android {
    namespace 'net.peach.messenger'
    compileSdk 34
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'net.peach.messenger'
        minSdk 24
        targetSdk 34
        versionCode 37
        versionName '2.26'
        // One ABI to start with: the embedded runtime is 84 MB per architecture,
        // so a phone build should not carry three copies it will never load.
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    packagingOptions {
        // Keep the prebuilt runtime uncompressed and loadable by the linker.
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
