<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/device.js"></script>
<title>Sign in Â· Peach Assist</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { display: grid; place-items: center; background: #eef2f7; }
  .login-wrap { width: 100%; max-width: 390px; padding: 24px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .brand .logo {
    width: 38px; height: 38px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent-2), var(--accent)); color: #fff;
    display: grid; place-items: center; font-weight: 700; box-shadow: 0 6px 16px rgba(28,45,66,.18);
  }
  .brand .t { font-weight: 700; font-size: 16px; }
  .brand .s { color: var(--muted); font-size: 11.5px; }
  .card { background: #fff; border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 20px; }
  .card h1 { font-size: 15px; margin: 0 0 12px; }
  .card .btn { width: 100%; padding: 9px; }
  .or { display: flex; align-items: center; gap: 10px; color: var(--faint); font-size: 11px; margin: 16px 0; }
  .or::before, .or::after { content: ''; height: 1px; background: var(--border); flex: 1; }
  .msg { font-size: 12px; margin-top: 10px; min-height: 16px; }
  .msg.err { color: var(--red); }
  .msg.ok { color: #2f9e5f; }

  /* ---- winter holidays in the lobby ---- */
  body { position: relative; overflow: hidden; }
  body::before {
    content: ''; position: fixed; inset: 0 0 auto; height: 4px; z-index: 3;
    background: linear-gradient(90deg, #b23b2e, #d8a64a, #2f6d4f, #b23b2e);
  }
  .holiday-sky { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .holiday-sky i {
    position: absolute; top: -14px; border-radius: 50%; background: #fff;
    box-shadow: 0 0 6px rgba(255, 255, 255, .9); opacity: .8;
    animation: snowfall linear infinite;
  }
  @keyframes snowfall {
    0% { transform: translate3d(0, -10px, 0); }
    100% { transform: translate3d(24px, 104vh, 0); }
  }
  .login-wrap { position: relative; z-index: 2; }
  .card { position: relative; }
  .card::after {
    content: ''; position: absolute; left: 14px; right: 14px; top: 0; height: 2px;
    background: linear-gradient(90deg, transparent, #d8a64a, transparent);
    border-radius: 2px;
  }
  .brand .season {
    margin-top: 5px; font-size: 10.5px; letter-spacing: .12em;
    text-transform: uppercase; color: #b4552f;
  }
  @media (prefers-reduced-motion: reduce) {
    .holiday-sky i { animation: none; opacity: .3; }
  }
</style>
</head>
<body>
<div class="holiday-sky" id="holidaySky" aria-hidden="true"></div>
<div class="login-wrap">
  <div class="brand">
    <div class="logo">M</div>
    <div>
      <div class="t">Peach Assist</div>
      <div class="s">Business conversations</div>
      <div class="season">Happy holidays</div>
    </div>
  </div>

  <div class="card">
    <h1>Sign in</h1>
    <div class="field">
      <label for="username">Email or username</label>
      <input id="username" type="text" placeholder="admin" value="admin" autocomplete="username">
    </div>
    <div class="field" style="margin-top:10px">
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Your password" autocomplete="current-password">
    </div>
    <button class="btn primary" id="btnLogin" style="margin-top:12px">Sign in</button>
    <div id="twofaBox" hidden>
      <div class="field" style="margin-top:12px">
        <label for="code">Six-digit code from your authenticator app</label>
        <input id="code" type="text" inputmode="numeric" maxlength="6" placeholder="123456" autocomplete="one-time-code">
      </div>
      <button class="btn primary" id="btnCode" style="margin-top:10px">Verify and sign in</button>
      <button class="btn ghost" id="btnBack" style="margin-top:6px">Start again</button>
    </div>
    <div class="msg" id="msg"></div>

    <div class="or">or</div>

    <div class="field">
      <label for="email">Email me a sign-in link</label>
      <input id="email" type="email" placeholder="operator@localhost" autocomplete="username">
    </div>
    <button class="btn" id="btnMagic" style="margin-top:12px">Send link</button>
    <div class="note" style="margin-top:10px">In development the link is printed to the server console.</div>
  </div>
</div>

<script src="/theme.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const msg = (text, cls) => { const m = $('msg'); m.textContent = text; m.className = 'msg ' + (cls || ''); };

  let twofaTicket = '';

  $('btnLogin').addEventListener('click', async () => {
    msg('');
    const password = $('password').value;
    if (!password) { msg('Enter your password.', 'err'); return; }
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      // username is optional; "admin" or the operator email both work
      body: JSON.stringify({ username: $('username').value.trim(), password }),
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok && data.twoFactor) {
      twofaTicket = data.ticket;
      $('twofaBox').hidden = false;
      $('btnLogin').hidden = true;
      $('code').focus();
      msg('Enter the code from your authenticator app.', 'ok');
      return;
    }
    if (res.ok) { location.href = '/app'; return; }
    msg('That username and password did not work.', 'err');
  });

  $('btnCode').addEventListener('click', async () => {
    msg('');
    const code = $('code').value.replace(/\D/g, '');
    if (code.length !== 6) { msg('The code is six digits.', 'err'); return; }
    const res = await fetch('/api/login/2fa', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ticket: twofaTicket, code }),
    });
    if (res.ok) { location.href = '/app'; return; }
    const data = await res.json().catch(() => ({}));
    msg(data.error || 'That code did not work.', 'err');
  });

  $('btnBack').addEventListener('click', () => {
    twofaTicket = '';
    $('twofaBox').hidden = true;
    $('btnLogin').hidden = false;
    $('code').value = '';
    msg('');
  });

  $('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btnCode').click(); });

  ['username', 'password'].forEach((f) =>
    $(f).addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btnLogin').click(); }));

  $('btnMagic').addEventListener('click', async () => {
    msg('');
    const email = $('email').value.trim();
    if (!email) { msg('Enter your email address.', 'err'); return; }
    await fetch('/api/magic', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    msg('If that address is on file, a link is on its way.', 'ok');
  });
</script>
  <p id="signupLink" style="display:none;text-align:center;margin-top:14px;font-size:12px">
    <a href="/signup" style="color:var(--accent)">Create an account</a>
  </p>
  <script>
    // Only shown when the administrator has loaded the Sign-up module.
    fetch('/api/signup').then(function (r) {
      if (r.ok) document.getElementById('signupLink').style.display = 'block';
    }).catch(function () {});
  </script>
  <script>
    // A quiet snowfall behind the card.
    (function () {
      var sky = document.getElementById('holidaySky');
      if (!sky) return;
      for (var i = 0; i < 22; i++) {
        var f = document.createElement('i');
        var size = 2 + Math.random() * 4;
        f.style.width = size + 'px';
        f.style.height = size + 'px';
        f.style.left = (Math.random() * 100) + '%';
        f.style.animationDuration = (9 + Math.random() * 12) + 's';
        f.style.animationDelay = (-Math.random() * 20) + 's';
        f.style.opacity = String(0.3 + Math.random() * 0.5);
        sky.appendChild(f);
      }
    })();
  </script>
